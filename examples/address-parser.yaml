# The pipeline: rules first, then these services in order — and only while the result is still
# wrong. The parser knows three things about a service: where it sits in the order, whether it is
# on, and its settings. What the service actually is, is the service's own business.

# Limits for every service that talks over HTTP. A parser called from a request path must never
# inherit a client's "wait forever" default.
http:
  connect_timeout: 3    # seconds for the TCP + TLS handshake
  timeout: 10           # seconds for the whole exchange

# Which quality problems justify paying for a service call. Omit to escalate on any problem.
# Keep the list tight: each entry is money and latency spent on the addresses that trigger it.
escalate_on:
  - country_missing
  - token_lost

services:
  # Cheap and fast goes first — a libpostal sidecar answers in milliseconds and costs nothing.
  - service: libpostal
    enabled: true
    endpoint: '${LIBPOSTAL_URL:-http://libpostal.internal:8080/parse}'

  - service: claude
    enabled: true
    model: claude-opus-5
    max_tokens: 2048
    # Secrets stay out of this file: the value is read from the environment when the config loads,
    # and a missing variable is an error here rather than a failed call in production.
    api_key: '${ANTHROPIC_API_KEY}'
    # Set aws_region to go through Bedrock instead of the Anthropic API. The `anthropic.` model
    # prefix is added for you.
    # aws_region: '${AWS_REGION}'
    #
    # Address strings repeat heavily in real data, so answers are cached — 30 days by default.
    cache_ttl: 2592000

  # Anything else: a class from your own project, with its own settings. No registration needed.
  # - service: paf
  #   class: App\Address\IdealPostcodesRefiner
  #   enabled: false
  #   api_key: '${IDEAL_POSTCODES_KEY}'
