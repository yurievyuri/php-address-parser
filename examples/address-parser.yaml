# Which quality problems justify calling a provider. Omit the key to escalate on any problem.
#
# Keep this list tight: every issue listed here is money and latency spent on the addresses that
# trigger it. `country_missing` and `token_lost` are the two that block downstream systems.
escalate_on:
  - country_missing
  - token_lost

providers:
  # Consulted in order, and only while the result is still wrong. Put the cheap and fast ones
  # first — a libpostal sidecar answers in milliseconds and costs nothing per call.
  - type: libpostal
    endpoint: 'http://libpostal.internal:8080/parse'
    timeout: 2.0
    connect_timeout: 1.0

  - type: llm
    name: claude
    # Anthropic API by default. Set aws_region to go through Bedrock instead — the `anthropic.`
    # model prefix is applied automatically.
    # aws_region: eu-west-1
    model: claude-opus-5
    max_tokens: 2048
    # The API key is read from ANTHROPIC_API_KEY when not given here.
    # api_key: '...'
    # Address strings repeat heavily in real data; answers are cached for 30 days by default.
    cache_ttl: 2592000

  # Anything else — your own class, anywhere in your project.
  # - type: custom
  #   class: App\Address\IdealPostcodesRefiner
  #   options:
  #     api_key: '...'

  # A provider can be left configured but switched off.
  # - type: llm
  #   enabled: false
